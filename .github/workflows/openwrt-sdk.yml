name: OpenWrt SDK

on:
  pull_request:
    paths:
      - ".github/workflows/openwrt-sdk.yml"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "packaging/openwrt/**"
      - "scripts/prepare-openwrt-feed.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.openwrt }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt: "25.12.5"
            arch: x86_64
          - openwrt: "24.10.7"
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare immutable package feed
        run: scripts/prepare-openwrt-feed.sh .openwrt-feed 0.0.0 "$GITHUB_SHA"

      - name: Build with official OpenWrt SDK
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.openwrt }}
          FEED_DIR: ${{ github.workspace }}/.openwrt-feed
          FEEDNAME: presence
          PACKAGES: openwrt-presence-agent
          V: s

      - name: Verify package was produced
        run: |
          package="$(find bin -type f \( -name 'openwrt-presence-agent_*.ipk' -o -name 'openwrt-presence-agent-*.apk' \) -print -quit)"
          test -n "$package"
          printf 'package=%s\n' "$package" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-presence-agent-${{ matrix.openwrt }}-${{ matrix.arch }}
          path: ${{ env.package }}
          if-no-files-found: error
